server.servlet.context-path=/api/v1
spring.application.name=stronghub

# Postgres (DB Credentials)
spring.datasource.url=jdbc:postgresql://localhost:5432/stronghub
spring.datasource.username=stronghub
spring.datasource.password=stronghub
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Swagger UI
# Acceso: http://localhost:8080/api/v1/swagger-ui.html

# --- Desactivar schema.sql/data.sql de Spring (usaremos Flyway) ---
spring.sql.init.mode=never

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Si usas un esquema espec�fico:
# spring.flyway.schemas=public
# spring.flyway.default-schema=public